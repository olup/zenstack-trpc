name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Type check tests
        run: pnpm typecheck:tests

      - name: Type check with TypeScript native preview
        run: pnpm typecheck:tsgo

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
